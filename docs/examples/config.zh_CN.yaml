language: zh_CN
watch_config: true
watch_stylesheet: true
bars:
  primary-bar:
    screens: ["*"]
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    dimensions:
      width: 100%
      height: 48
    collapse:
      enabled: true
      collapsed_height: 34
      start_collapsed: true
    widgets:
      left: []
      center: [clock]
      right: [cpu, memory, volume]
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "\uE8A9"
      menu_list:
        - title: 用户主目录
          path: "~"
        - title: 下载
          path: "~\\Downloads"
        - title: 文档
          path: "~\\Documents"
        - title: 图片
          path: "~\\Pictures"
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: "{%H:%M}"
      callbacks:
        on_left: toggle_calendar
        on_right: context_menu
  cpu:
    type: yasb.cpu.CpuWidget
  memory:
    type: yasb.memory.MemoryWidget
  volume:
    type: yasb.volume.VolumeWidget
